version: "2"
authtoken: YOUR_NGROK_AUTH_TOKEN_HERE
tunnels:
  enpara-mcp:
    proto: http
    addr: 3000
    subdomain: enpara-mcp
    inspect: true
    bind_tls: true
    # Custom domain (opsiyonel - ngrok pro gerektirir)
    # hostname: enpara.your-domain.com
    
  enpara-mcp-dev:
    proto: http
    addr: 3000
    inspect: true
    bind_tls: true

# Web interface
web_addr: localhost:4040
console_ui: true
log_level: info
log_format: json

# Region (en yakın bölge)
region: eu

